services:
  server:
    build: .
    container_name: novvo_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres          # dentro do Docker, NUNCA usar localhost
      DB_PORT: 5432
      DB_NAME: app_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Chave de assinatura dos tokens de sessão (login). Este valor serve
      # só para uso local/Docker — no Render, o render.yaml gera uma chave
      # aleatória própria automaticamente (generateValue: true). Se for
      # expor este ambiente local além da sua máquina, troque por um valor
      # aleatório seu (ex.: `openssl rand -hex 32`).
      JWT_SECRET: troque-esta-chave-para-uso-local-openssl-rand-hex-32
      # Senhas dos usuários padrão criados por scripts/migrate.js. Não há
      # nenhuma senha de fábrica no código — sem estas duas variáveis, o
      # migrate simplesmente não cria usuário nenhum. Os valores abaixo são
      # só para uso local/Docker: troque-os por algo seu antes de usar em
      # qualquer ambiente que não seja a sua máquina.
      DEFAULT_ADMIN_PASSWORD: troque-esta-senha-admin-local
      DEFAULT_TEST_PASSWORD: troque-esta-senha-teste-local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novvo_network

  postgres:
    image: postgres:16-alpine
    container_name: novvo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - novvo_network

networks:
  novvo_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
